# Controller set for the servo pusher.
#
# NOTE: this file lives in sorting_robot_controller (not
# sorting_robot_description) on purpose: controller_manager mangles the
# forwarded "--params-file" argument when its path contains the substring
# "robot_description", producing "Couldn't parse params file: '--params-file
# -p'". Keeping the YAML in a package whose path has no "robot_description"
# avoids the bug.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    pusher_position_controller:
      type: forward_command_controller/ForwardCommandController

pusher_position_controller:
  ros__parameters:
    joints:
      - pusher_joint
    interface_name: position
